version: "3.8"

services:
  helper:
    build: .
    image: caddy-helper:latest
    container_name: caddy_helper
    restart: "no"
    tty: true
    stdin_open: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/app
    env_file:
      - .env.example
    networks:
      - caddy_net

  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    restart: always
    volumes:
      - ./Caddyfile.generated:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true

volumes:
  caddy_data:
  caddy_config:
